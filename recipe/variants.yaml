# pythonocc-core 7.9.3 and 8.0.1 exist on conda-forge for Python 3.10 - 3.14 (win-64, linux-64)
python:
  - 3.10.* *_cpython
  - 3.11.* *_cpython
  - 3.12.* *_cpython
  - 3.13.* *_cp313
  - 3.14.* *_cp314

occt:
  - 7.9.3
  - 8.0.1

# same compilers as conda-forge, so the binaries match the pythonocc-core builds
cxx_compiler:
  - if: win
    then: vs2022
  - if: linux
    then: gxx

cxx_compiler_version:
  - if: linux
    then: 15

c_stdlib:
  - if: win
    then: vs
  - if: linux
    then: sysroot

c_stdlib_version:
  - if: linux
    then: 2.17
